<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1e3a8a"/>
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Content -->
  <text x="100" y="200" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">AOA Import Export</text>
  <text x="100" y="260" fill="#f59e0b" font-family="Arial, sans-serif" font-size="32">Reliable Import & Export Solutions</text>
  <text x="100" y="310" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="24">for Global Markets</text>
  
  <!-- MSME Badge -->
  <rect x="100" y="380" width="200" height="40" rx="20" fill="#f59e0b"/>
  <text x="200" y="405" fill="white" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">MSME Registered</text>
  
  <!-- Decorative Elements -->
  <circle cx="900" cy="150" r="80" fill="rgba(245, 158, 11, 0.2)"/>
  <circle cx="1000" cy="400" r="60" fill="rgba(255, 255, 255, 0.1)"/>
  <circle cx="800" cy="500" r="40" fill="rgba(245, 158, 11, 0.3)"/>
</svg>